<!--
  EXAMPLE · drawer · Approach (A): UTILITY-FIRST — classes live in the markup.

  Same UI as drawer.bem.html, so you can diff A vs B on identical structure.
  Framework-agnostic: plain HTML on a NATIVE <dialog>. The only JS is a native
  platform API (dialog.showModal() opens it; a <form method="dialog"> submit or
  Esc closes it) — NOT a framework. showModal() gives a real modal off-canvas
  panel: focus trap and an inert background come from the platform, not from us.

  Off-canvas slide-in (v4): the panel is pinned to a screen edge and starts
  translated fully off-screen; on open it slides to translate-x-0. The enter
  animation needs the `starting:` variant (@starting-style) so the browser has a
  frame to transition FROM, plus `transition-discrete` so display/overlay stay
  animatable while the dialog appears/disappears:
    closed→open  →  starting:open:translate-x-full   (initial frame, off-screen)
    open         →  open:translate-x-0                (target frame, on-screen)
  The side is just a positioning + translate swap: this file shows the RIGHT
  drawer; for a LEFT drawer use `mr-auto`, `left-3` and `-translate-x-full`
  (see the commented variant on the dialog). prefers-reduced-motion is respected
  with motion-reduce:transition-none.

  Tokens are the canonical SEMANTIC ones from templates/theme.css
  (bg-card / text-card-foreground, border-border, bg-muted, outline-ring …).
  Replace the token VALUES under your design system; the NAMES stay stable.
  Dark theme works for free — every color is a token that .dark overrides, so
  this markup needs no `dark:` variants of its own.

  Accessibility: <dialog> sets role="dialog" + aria-modal itself; we add an
  aria-label so the panel is named for assistive tech, link the heading via
  aria-labelledby, and expose the full state set on every control (hover · active
  · focus-visible · disabled). Esc-to-close is native.
-->

<!-- demo wrapper: neutral page surface + the trigger that opens the drawer -->
<div class="flex flex-col items-start gap-4 bg-background p-6 text-foreground">

  <!-- Trigger: native platform API, no framework. Opens the NEXT sibling dialog. -->
  <button
    type="button"
    onclick="this.nextElementSibling.showModal()"
    class="inline-flex items-center justify-center gap-2
           h-10 px-4
           rounded-md border border-transparent
           bg-primary text-primary-foreground text-sm font-medium
           transition-colors duration-150 motion-reduce:transition-none
           hover:bg-primary/90
           focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring
           active:bg-primary/95
           disabled:opacity-50 disabled:pointer-events-none
           cursor-pointer select-none"
  >
    Open drawer
  </button>

  <!--
    Native off-canvas <dialog>, pinned to the RIGHT edge. `ml-auto` + full height
    push the panel to the right; `translate-x-full` parks it off-screen, and the
    `open:`/`starting:` variants drive the slide-in with no JS state. The
    `backdrop:` utilities style + fade the platform backdrop.

    LEFT variant — swap three classes on this element (UI stays identical, just
    mirrored): `ml-auto` → `mr-auto`, `right-3` → `left-3`, and
    `translate-x-full` / `open:translate-x-0` / `starting:open:translate-x-full`
    → `-translate-x-full` / `open:translate-x-0` / `starting:open:-translate-x-full`.
  -->
  <dialog
    aria-label="Settings panel"
    aria-labelledby="drawer-title"
    class="ml-auto right-3
           h-dvh max-h-dvh w-full max-w-sm
           m-0 p-0
           rounded-none border-l border-border
           bg-card text-card-foreground shadow-lg
           translate-x-full
           transition-[translate,display,overlay] duration-300 ease-out
           transition-discrete motion-reduce:transition-none
           open:translate-x-0
           starting:open:translate-x-full
           backdrop:bg-foreground/40
           backdrop:opacity-0 backdrop:transition-[opacity,display,overlay]
           backdrop:duration-300 backdrop:transition-discrete
           backdrop:open:opacity-100 backdrop:starting:open:opacity-0
           backdrop:motion-reduce:transition-none"
  >
    <!-- panel: full-height vertical stack, header / scrollable body -->
    <div class="flex h-full flex-col">

      <!-- header: title + a close (×) control -->
      <header class="flex shrink-0 items-start justify-between gap-4
                     border-b border-border p-4">
        <h2 id="drawer-title" class="text-base font-semibold leading-none tracking-tight">
          Settings panel
        </h2>

        <!-- close button: a real submit inside method="dialog" closes the dialog -->
        <form method="dialog" class="contents">
          <button
            type="submit"
            aria-label="Close drawer"
            class="-m-1 inline-flex shrink-0 items-center justify-center
                   size-7
                   rounded-sm border border-transparent
                   text-muted-foreground
                   transition-colors duration-150 motion-reduce:transition-none
                   hover:bg-muted hover:text-foreground
                   focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring
                   active:bg-muted
                   disabled:opacity-50 disabled:pointer-events-none
                   cursor-pointer"
          >
            <svg class="size-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </form>
      </header>

      <!-- body: scrolls independently when content overflows the panel height -->
      <div class="flex-1 overflow-y-auto p-4 text-sm leading-relaxed text-muted-foreground">
        Drawer content goes here. Keep the skeleton neutral; the surrounding design
        system supplies the real colors, type and spacing via the @theme tokens.
        The panel slides in from the edge, traps focus, and closes on Esc or via
        the × control.
      </div>

    </div>
  </dialog>

</div>
