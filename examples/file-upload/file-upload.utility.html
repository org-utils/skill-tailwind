<!--
  EXAMPLE · file-upload · Approach (A): UTILITY-FIRST — classes live in the markup.

  Same UI as file-upload.bem.html, so you can diff A vs B on identical structure.
  Framework-agnostic: plain HTML, no JS, no build step assumed here.

  HONEST SCOPE LIMIT (read this — it is the point of the example): a real
  <input type="file"> already gives native click-to-browse, keyboard access and
  a file picker for free — no JS needed for that part. What genuinely needs JS:
  (1) the "dragover" visual state — CSS `:hover` cannot express "a file is being
  dragged over this element", so a dragenter/dragleave/drop listener toggles a
  state class (`.is-dragover` for BEM, an equivalent utility set here) — the
  `dragover:` you'd want doesn't exist as a Tailwind variant; (2) reading dropped
  files into the same <input> (DataTransfer → input.files); (3) rendering the
  per-file rows below from the selected FileList. This markup shows the STATIC
  states only: default, "dragover" (as if the class were already toggled on),
  populated with files, and disabled.

  Tokens are the canonical SEMANTIC ones from templates/theme.css (border-input
  as the dashed default border, outline-ring + bg-accent for the drag-over
  affordance, bg-card/text-card-foreground for file rows, text-danger for the
  remove action). Replace the token VALUES under your design system; the NAMES
  stay stable. Dark theme works for free via .dark.
-->

<div class="flex flex-col gap-8 bg-background p-6 text-foreground">

  <!-- ── State: default ──────────────────────────────────────── -->
  <div class="flex flex-col gap-1.5">
    <span class="text-sm font-medium text-foreground">Attachments</span>
    <label
      for="fu-default"
      class="flex cursor-pointer flex-col items-center justify-center gap-2
             rounded-lg border-2 border-dashed border-input bg-background
             px-6 py-10 text-center
             transition-colors duration-150
             hover:border-ring hover:bg-muted
             has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-ring"
    >
      <svg class="size-8 text-muted-foreground" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 16V4M7 9l5-5 5 5M5 20h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="text-sm font-medium text-foreground">Drop files here or click to browse</span>
      <span class="text-xs text-muted-foreground">PNG, JPG, PDF up to 10MB</span>
      <input id="fu-default" type="file" multiple class="sr-only" />
    </label>
  </div>

  <!-- ── State: dragover (JS toggles this look on dragenter/dragleave) ── -->
  <div class="flex flex-col gap-1.5">
    <span class="text-sm font-medium text-foreground">Attachments</span>
    <label
      for="fu-dragover"
      class="flex cursor-pointer flex-col items-center justify-center gap-2
             rounded-lg border-2 border-dashed border-ring bg-accent
             px-6 py-10 text-center
             outline-2 outline-offset-2 outline-ring"
    >
      <svg class="size-8 text-accent-foreground" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 16V4M7 9l5-5 5 5M5 20h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="text-sm font-medium text-accent-foreground">Release to upload</span>
      <input id="fu-dragover" type="file" multiple class="sr-only" />
    </label>
  </div>

  <!-- ── State: populated with files ─────────────────────────── -->
  <div class="flex flex-col gap-1.5">
    <span class="text-sm font-medium text-foreground">Attachments</span>
    <label
      for="fu-files"
      class="flex cursor-pointer flex-col items-center justify-center gap-2
             rounded-lg border-2 border-dashed border-input bg-background
             px-6 py-10 text-center
             transition-colors duration-150
             hover:border-ring hover:bg-muted"
    >
      <svg class="size-8 text-muted-foreground" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 16V4M7 9l5-5 5 5M5 20h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="text-sm font-medium text-foreground">Drop files here or click to browse</span>
      <input id="fu-files" type="file" multiple class="sr-only" />
    </label>

    <!-- file rows: rendered from the selected FileList by JS -->
    <ul class="mt-2 flex flex-col gap-2">
      <li class="flex items-center gap-3 rounded-md border border-border bg-card px-3 py-2 text-card-foreground">
        <svg class="size-5 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14 3v5h5M6 3h9l5 5v13H6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <span class="min-w-0 flex-1 truncate text-sm text-foreground">quarterly-report.pdf</span>
        <span class="shrink-0 text-xs text-muted-foreground">2.4 MB</span>
        <button
          type="button"
          aria-label="Remove quarterly-report.pdf"
          class="inline-flex size-6 shrink-0 items-center justify-center rounded-sm
                 text-muted-foreground
                 hover:bg-danger hover:text-danger-foreground
                 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring
                 cursor-pointer"
        >
          <svg class="size-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </li>
      <li class="flex items-center gap-3 rounded-md border border-border bg-card px-3 py-2 text-card-foreground">
        <svg class="size-5 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14 3v5h5M6 3h9l5 5v13H6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <span class="min-w-0 flex-1 truncate text-sm text-foreground">team-photo.png</span>
        <span class="shrink-0 text-xs text-muted-foreground">860 KB</span>
        <button
          type="button"
          aria-label="Remove team-photo.png"
          class="inline-flex size-6 shrink-0 items-center justify-center rounded-sm
                 text-muted-foreground
                 hover:bg-danger hover:text-danger-foreground
                 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring
                 cursor-pointer"
        >
          <svg class="size-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </li>
    </ul>
  </div>

  <!-- ── State: disabled ─────────────────────────────────────── -->
  <div class="flex flex-col gap-1.5">
    <span class="text-sm font-medium text-muted-foreground">Attachments</span>
    <label
      for="fu-disabled"
      aria-disabled="true"
      class="flex flex-col items-center justify-center gap-2
             rounded-lg border-2 border-dashed border-input bg-muted
             px-6 py-10 text-center
             opacity-50 pointer-events-none"
    >
      <svg class="size-8 text-muted-foreground" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 16V4M7 9l5-5 5 5M5 20h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="text-sm font-medium text-muted-foreground">Uploads disabled</span>
      <input id="fu-disabled" type="file" multiple disabled class="sr-only" />
    </label>
  </div>

</div>
