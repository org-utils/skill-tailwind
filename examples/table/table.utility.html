<!--
  EXAMPLE · table · Approach (A): UTILITY-FIRST — classes live in the markup.

  Same structure and same UI as table.bem.html — diff A vs B on identical
  markup. No framework: a plain HTML fragment.

  Semantic data table:
    • <table> with <caption> (accessible table name; sr-only — visible to a
      screen reader, hidden visually, since a section heading already sits nearby);
    • <thead> with <th scope="col"> — column headers;
    • <tbody> with rows; the first cell of a row is <th scope="row"> (row name),
      the rest are <td>. scope links headers to cells for screen readers;
    • numeric columns are right-aligned and set in tabular-nums (monospaced
      digits → columns of digits line up visually).

  States/layers:
    • zebra — even:bg-muted/40 on <tbody> rows (translucency via slash);
    • row hover — hover:bg-muted/60 (highlight the hovered row);
    • sticky header — sticky top-0 z-10 on <thead> (headers stay visible during
      vertical scroll inside the height-constrained wrapper);
    • focus-visible — a visible ring (outline-ring) on the scroll wrapper, since
      with overflow it is keyboard-focusable (tabindex="0") for scrolling.

  Responsiveness: the dataTable wrapper is marked @container and provides
  overflow-x-auto — in a narrow container the table scrolls horizontally without
  breaking the page layout. On a wide one (@md) we add side padding to cells for air.

  SORTING/FILTERING — intentionally NOT implemented. A full click-to-sort on a
  header with aria-sort updates and row reordering needs ~20+ lines of native JS
  (handlers, comparator, <tbody> re-render). Only the semantics are shown here:
  aria-sort="ascending" on the sorted column as a markup example. We don't mimic
  a framework — JS is left as a flagged TODO.

  Tokens — canonical SEMANTIC ones (templates/theme.css): bg-card,
  text-card-foreground, bg-muted/-foreground, border-border, outline-ring.
  Values are placeholders for your design system; names are stable. Dark mode
  works without its own dark: variants — every color is a token from .dark.

  The demo wrapper below only provides background/padding and constrains the
  height so the sticky header is visible on scroll; it is not part of the component.
-->

<!-- demo wrapper: background, padding and height constraint to show the sticky header -->
<div class="bg-background p-6 text-foreground">

  <section class="mx-auto max-w-3xl">
    <h2 class="mb-3 text-base font-semibold">Team invoices</h2>

    <!--
      Component wrapper: @container makes it a container-query context,
      overflow-x-auto provides horizontal scroll on a narrow one, max-h-80 +
      overflow-y — vertical scroll, which is what the sticky header works for.
      tabindex="0" + role="region" + aria-label: the scroll area must be
      keyboard-focusable (otherwise you can't scroll it without a mouse) — and
      then a visible focus is needed.
    -->
    <div
      role="region"
      aria-label="Team invoices, scrollable"
      tabindex="0"
      class="@container max-h-80 w-full overflow-auto
             rounded-lg border border-border bg-card text-card-foreground
             focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring">

      <table class="w-full border-collapse text-sm">
        <!-- accessible table name; sr-only — duplicates the visible <h2>, but is announced -->
        <caption class="sr-only">Team invoices for the current quarter</caption>

        <!-- sticky header: stays visible during vertical scroll of the wrapper -->
        <thead class="sticky top-0 z-10 bg-muted text-muted-foreground">
          <tr class="border-b border-border">
            <th scope="col"
                class="select-none px-3 py-2.5 text-left font-medium @md:px-4">Invoice</th>
            <th scope="col"
                class="select-none px-3 py-2.5 text-left font-medium @md:px-4">Client</th>
            <!-- status — a text column -->
            <th scope="col"
                class="select-none px-3 py-2.5 text-left font-medium @md:px-4">Status</th>
            <!--
              sorted column: aria-sort tells the screen reader the direction.
              The value is static (markup demo) — toggling requires JS (see header).
            -->
            <th scope="col" aria-sort="ascending"
                class="select-none px-3 py-2.5 text-right font-medium @md:px-4">Amount</th>
          </tr>
        </thead>

        <tbody>
          <!-- zebra even:bg-muted/40 + hover:bg-muted/60 on each row -->
          <tr class="border-b border-border even:bg-muted/40 hover:bg-muted/60 transition-colors duration-150 motion-reduce:transition-none">
            <!-- row name: <th scope="row"> links the rest of the row's cells -->
            <th scope="row"
                class="px-3 py-2.5 text-left font-medium @md:px-4">INV-1001</th>
            <td class="px-3 py-2.5 @md:px-4">Acme Corp</td>
            <td class="px-3 py-2.5 @md:px-4">
              <!-- the status tone is duplicated by a WORD, not color alone -->
              <span class="inline-flex items-center rounded-sm bg-success/15 px-2 py-0.5 text-xs font-medium text-success">
                Paid
              </span>
            </td>
            <!-- number: right + tabular-nums to align digits by place value -->
            <td class="px-3 py-2.5 text-right tabular-nums @md:px-4">$1,200.00</td>
          </tr>

          <tr class="border-b border-border even:bg-muted/40 hover:bg-muted/60 transition-colors duration-150 motion-reduce:transition-none">
            <th scope="row"
                class="px-3 py-2.5 text-left font-medium @md:px-4">INV-1002</th>
            <td class="px-3 py-2.5 @md:px-4">Globex</td>
            <td class="px-3 py-2.5 @md:px-4">
              <span class="inline-flex items-center rounded-sm bg-warning/15 px-2 py-0.5 text-xs font-medium text-warning">
                Pending
              </span>
            </td>
            <td class="px-3 py-2.5 text-right tabular-nums @md:px-4">$840.50</td>
          </tr>

          <tr class="border-b border-border even:bg-muted/40 hover:bg-muted/60 transition-colors duration-150 motion-reduce:transition-none">
            <th scope="row"
                class="px-3 py-2.5 text-left font-medium @md:px-4">INV-1003</th>
            <td class="px-3 py-2.5 @md:px-4">Initech</td>
            <td class="px-3 py-2.5 @md:px-4">
              <span class="inline-flex items-center rounded-sm bg-danger/15 px-2 py-0.5 text-xs font-medium text-danger">
                Overdue
              </span>
            </td>
            <td class="px-3 py-2.5 text-right tabular-nums @md:px-4">$3,015.00</td>
          </tr>

          <tr class="border-b border-border even:bg-muted/40 hover:bg-muted/60 transition-colors duration-150 motion-reduce:transition-none">
            <th scope="row"
                class="px-3 py-2.5 text-left font-medium @md:px-4">INV-1004</th>
            <td class="px-3 py-2.5 @md:px-4">Umbrella</td>
            <td class="px-3 py-2.5 @md:px-4">
              <span class="inline-flex items-center rounded-sm bg-success/15 px-2 py-0.5 text-xs font-medium text-success">
                Paid
              </span>
            </td>
            <td class="px-3 py-2.5 text-right tabular-nums @md:px-4">$560.00</td>
          </tr>

          <tr class="border-b border-border even:bg-muted/40 hover:bg-muted/60 transition-colors duration-150 motion-reduce:transition-none">
            <th scope="row"
                class="px-3 py-2.5 text-left font-medium @md:px-4">INV-1005</th>
            <td class="px-3 py-2.5 @md:px-4">Hooli</td>
            <td class="px-3 py-2.5 @md:px-4">
              <span class="inline-flex items-center rounded-sm bg-warning/15 px-2 py-0.5 text-xs font-medium text-warning">
                Pending
              </span>
            </td>
            <td class="px-3 py-2.5 text-right tabular-nums @md:px-4">$12,480.75</td>
          </tr>
        </tbody>

        <!-- total row: <th scope="row"> for the label + tabular-nums for the amount -->
        <tfoot class="border-t border-border bg-muted/30 font-medium">
          <tr>
            <th scope="row" colspan="3"
                class="px-3 py-2.5 text-right @md:px-4">Total</th>
            <td class="px-3 py-2.5 text-right tabular-nums @md:px-4">$18,096.25</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </section>

</div>
