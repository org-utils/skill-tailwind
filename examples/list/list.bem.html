<!--
  EXAMPLE · list · Approach (B): BEM markup — styles in list.bem.scss.

  Same UI as in list.utility.html (list-group: clickable rows with a leading
  icon, title + secondary text, trailing meta/badge; one row is active). Here the
  markup carries SEMANTIC names per BEM; the appearance is assembled from
  utilities via @apply in list.bem.scss.

  The skill's BEM convention:
    block             list
    elements          list-item, list-leading, list-content, list-title,
                      list-subtitle, list-meta
    element modifier  list-item_active   (= the active row, aria-current="page")
  One block per component; elements always derive from the block (no -a-b chains).

  Semantics identical to approach A: <ul> → <li>, each row is a clickable <a>
  with a full set of states. Separators (divide-y) and container rounding live
  in the SCSS on the list block. The active row — <a class="… list-item_active"> +
  aria-current="page" (position for the screen reader, not only color).

  Parity with approach A: structure and states are identical; the only difference
  is WHERE the style lives (in the SCSS, not in markup classes). No framework: plain HTML.
-->

<!-- demo wrapper: neutral page background so the list reads in context -->
<div class="min-h-64 bg-background text-foreground p-6">
  <ul class="list" aria-label="Projects">

    <!-- Row 1: a regular clickable row -->
    <li>
      <a href="/projects/atlas" class="list-item">
        <!-- leading icon: decorative (the adjacent text carries the meaning) -->
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             class="list-leading">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2" />
        </svg>

        <!-- main block: title + secondary (muted) text -->
        <span class="list-content">
          <span class="list-title">Atlas</span>
          <span class="list-subtitle">Updated 2 hours ago</span>
        </span>

        <!-- trailing meta: counter badge at the right edge -->
        <span class="list-meta">12</span>
      </a>
    </li>

    <!-- Row 2: ACTIVE (modifier list-item_active + aria-current="page") -->
    <li>
      <a href="/projects/orbit" class="list-item list-item_active" aria-current="page">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             class="list-leading">
          <circle cx="12" cy="12" r="9" stroke-width="2" />
          <circle cx="12" cy="12" r="2" stroke-width="2" />
        </svg>

        <span class="list-content">
          <span class="list-title">Orbit</span>
          <span class="list-subtitle">Updated yesterday</span>
        </span>

        <span class="list-meta list-meta_accent">3</span>
      </a>
    </li>

    <!-- Row 3: a regular clickable row -->
    <li>
      <a href="/projects/relay" class="list-item">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             class="list-leading">
          <path d="M4 7h16M4 12h16M4 17h10" stroke-width="2" stroke-linecap="round" />
        </svg>

        <span class="list-content">
          <span class="list-title">Relay</span>
          <span class="list-subtitle">Updated last week</span>
        </span>

        <!-- trailing meta: secondary status as a word (not only color) -->
        <span class="list-meta list-meta_success">Active</span>
      </a>
    </li>
  </ul>
</div>
