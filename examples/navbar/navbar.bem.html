<!--
  EXAMPLE · navbar · Approach (B): BEM markup — styles live in navbar.bem.scss.

  Same UI as in navbar.utility.html (responsive header: brand + links +
  actions; the mobile menu expands WITHOUT JS via the native <details>/<summary>).
  Here the markup carries SEMANTIC BEM names; the appearance is assembled from
  utilities via @apply in navbar.bem.scss.

  Skill BEM convention (element separator '-', modifier separator '_';
  camelCase for multi-word parts):
    block           navbar
    elements        navbar-brand, navbar-menu, navbar-link, navbar-actions,
                    navbar-toggle, navbar-cta
    element modifier navbar-link_active  (= active item, aria-current="page")

  CTA reuse: the primary button is the shared `button` block (button +
  button_primary — see examples/button), placed here via a BEM mix:
  class="button button_primary navbar-cta". The block owns appearance + states;
  navbar-cta sets only placement/visibility. See references/approaches.md §7.

  Pairing with approach A: structure and states are identical; only WHERE the
  style lives differs (in SCSS, not in markup classes).

  No framework: plain HTML. Platform <details> instead of a JS toggle.
-->

<!-- demo wrapper: neutral page background so the header reads in context -->
<div class="min-h-32 bg-background text-foreground">
  <header class="navbar">
    <nav aria-label="Main" class="navbar-inner">

      <!-- <details> = the "menu open" state without JS; on >=md the menu is always visible -->
      <details class="navbar-details">
        <div class="navbar-bar">

          <!-- Brand: text link to home, no logo -->
          <a href="/" class="navbar-brand">Brand</a>

          <!-- Burger: <summary> as a button. Hidden on >=md. -->
          <summary class="navbar-toggle" aria-label="Toggle navigation menu">
            <svg class="navbar-toggleIcon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </summary>
        </div>

        <!-- Menu panel: links + actions (hidden on mobile, expands on [open]) -->
        <div class="navbar-menu">
          <ul class="navbar-list">
            <li>
              <a href="/" class="navbar-link navbar-link_active" aria-current="page">Dashboard</a>
            </li>
            <li>
              <a href="/projects" class="navbar-link">Projects</a>
            </li>
            <li>
              <a href="/team" class="navbar-link">Team</a>
            </li>
            <li>
              <a href="/settings" class="navbar-link">Settings</a>
            </li>
          </ul>

          <!-- Actions block: the shared `button` block reused via a BEM mix
               (button button_primary = appearance + states; navbar-cta = placement) -->
          <div class="navbar-actions">
            <a href="/signin" class="button button_primary navbar-cta">Sign in</a>
          </div>
        </div>
      </details>
    </nav>
  </header>
</div>
