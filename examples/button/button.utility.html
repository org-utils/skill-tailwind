<!--
  EXAMPLE · button · Approach (A): UTILITY-FIRST — classes live in the markup.

  Same UI as button.bem.html, so you can diff A vs B on identical structure.
  Framework-agnostic: plain HTML, no JS, no build step assumed here.

  Tokens are the canonical SEMANTIC ones from templates/theme.css
  (bg-primary / text-primary-foreground, bg-muted, border-border, outline-ring …).
  Replace the token VALUES under your design system; the NAMES stay stable.
  Dark theme works for free — every color is a token that .dark overrides, so
  this markup needs no `dark:` variants of its own.

  Variants: primary · outline (secondary) · ghost · danger.
  Sizes:    sm (h-8) · md (h-10) · lg (h-12), with matching px and text-*.
  States:   hover · active · focus-visible · disabled — all via variants.
  Leading icon: <svg class="size-4 shrink-0"> placeholder, aria-hidden.

  Tag by BEHAVIOUR, not by look: a thing that ACTS is a <button>, a thing that
  NAVIGATES is an <a href>. The SAME button utility classes style EITHER tag,
  so a "link styled as a button" is a real <a href> carrying those classes —
  including the focus-visible:* ring, which then lands on the actually-focusable
  navigation control. See the last row. NEVER wrap an <a> in a styled <button>
  to borrow its look; that nests two interactive elements and strands the focus
  ring on the non-navigating wrapper.
-->

  <!-- ── Link styled as a button (NAVIGATES) ─────────────────── -->
  <!--
    A real <a href> with the SAME button utilities as the primary <button>
    above. It LOOKS like a button but NAVIGATES, so the anchor is the correct
    tag. The focus-visible:* ring is on the <a> itself, so the focus treatment
    lands on the real, focusable navigation control. `no-underline` keeps it
    reading as a button; the `disabled:*` variants are dropped because <a> has
    no disabled state (omit href / add aria-disabled if a link must be inert).
    Do NOT wrap a bare <a> inside this styled <button> to reuse the look.
  -->
  <div class="flex flex-wrap items-center gap-3">
